syntax = "proto3";

package pipeline_models;

import "google/protobuf/struct.proto";
import "orchestration_pipelines_models/pipeline_v1_model/protos/validation.proto";

/////////////////////////
// Pipeline Models
////////////////////////
message OrchestrationPipeline {
  string model_version = 1 [(pipeline_models.validation.is_required) = true];
  string pipeline_id = 2 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.regex) = "^[a-zA-Z0-9_-]+$",
    (pipeline_models.validation.min_len) = 1,
    (pipeline_models.validation.max_len) = 64
  ];
  string description = 3;
  PipelineRunner runner = 4 [(pipeline_models.validation.disallow_zero_enum) = true];
  string owner = 5 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.regex) = "^[a-zA-Z0-9_#-]+$",
    (pipeline_models.validation.min_len) = 1,
    (pipeline_models.validation.max_len) = 32
  ];
  Defaults defaults = 6 [(pipeline_models.validation.is_required) = true];
  repeated Trigger triggers = 7; // Can be empty.
  repeated Action actions = 8 [(pipeline_models.validation.min_items) = 1];
  // Validation for items in repeated fields (e.g. regex for each tag) is not
  // supported by field options and should be handled in custom logic.
  // Each tag should match: ^[a-zA-Z0-9_-]{1,32}$
  repeated string tags = 9; // Can be empty.
  Notification notifications = 10;
  // Parameters that can be passed to the pipeline when triggered at runtime.
  map<string, Parameter> parameters = 11;
  // Dynamic CEL expression bindings keyed by field path.
  map<string, string> dynamic_bindings = 12;
}

message Parameter {
  enum Type {
    type_undefined = 0;
    string = 1;
    number = 2;
    boolean = 3;
    array = 4;
  }
  // The expected data type of the parameter.
  Type type = 1 [(pipeline_models.validation.disallow_zero_enum) = true];
  // The default value to use if the parameter is not provided during trigger.
  // google.protobuf.Value is used to support polymorphic types (string, number, bool, list).
  google.protobuf.Value default_value = 2 [
    json_name = "default",
    (pipeline_models.validation.is_required) = true
  ];
  // An optional description of what the parameter is used for.
  string description = 3;
}

enum PipelineRunner {
  pipeline_runner_undefined = 0;
  airflow = 1;
}

enum TriggerRule {
  trigger_rule_undefined = 0;
  all_success = 1;
  all_failed = 2;
  all_done = 3;
  one_failed = 4;
  one_success = 5;
  always = 6;
}

message Defaults {
  string project_id = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  string location = 2 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  ExecutionConfig execution_config = 3 [deprecated = true];
  RetryPolicy retry_policy = 4;
}

message ExecutionConfig {
  // Per proto3 design, scalar fields like int32 have a default value (0) and
  // cannot be truly 'required'. The `min_value` option is used instead.
  int32 retries = 1 [
    deprecated = true,
    (pipeline_models.validation.min_value) = 0,
    (pipeline_models.validation.is_parameterizable) = true
  ];
}

/////////////////////////
// Retry Policies
/////////////////////////
message FixedDelayStrategy {
  // ISO 8601 duration or standard time string (e.g., "30s", "5m").
  string retry_delay = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
}

message ExponentialBackoffStrategy {
  string initial_delay = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  string max_delay = 2 [
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  double multiplier = 3 [(pipeline_models.validation.is_parameterizable) = true]; // Default: 2.0
  bool randomize_jitter = 4 [(pipeline_models.validation.is_parameterizable) = true]; // Default: false
}

message RetryPolicy {
  // Hard ceiling on maximum retry attempts across all strategies.
  optional int32 max_retries = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.min_value) = 0,
    (pipeline_models.validation.is_parameterizable) = true
  ];

  oneof strategy {
    FixedDelayStrategy fixed_delay = 2;
    ExponentialBackoffStrategy exponential_backoff = 3;
  }
}

message OnPipelineFailure {
  repeated string email = 1 [(pipeline_models.validation.is_parameterizable) = true];
}

message OnPipelineSuccess {
  repeated string email = 1 [(pipeline_models.validation.is_parameterizable) = true];
}

message Notification {
  OnPipelineFailure on_pipeline_failure = 1;
  OnPipelineSuccess on_pipeline_success = 2;
}

/////////////////////////
// Triggers
////////////////////////
message ScheduleTrigger {
  string interval = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_cron_expression) = true
  ];
  string start_time = 2 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_iso8601_timestamp) = true
  ];
  // Cross-field validation (e.g. end_time > start_time) should be handled
  // in custom validation logic.
  string end_time = 3 [(pipeline_models.validation.is_iso8601_timestamp) = true];
  bool catchup = 4; // Default: false.
  string timezone = 5 [(pipeline_models.validation.is_iana_timezone) = true]; // Defaults to "UTC" if not provided.
}

message Trigger {
  oneof trigger {
    ScheduleTrigger schedule = 1;
  }
}

/////////////////////////
// Engines
////////////////////////
message LocalEngine {}

message BigQueryEngine {
  string location = 1 [(pipeline_models.validation.is_parameterizable) = true];
  string destination_table = 2 [(pipeline_models.validation.is_parameterizable) = true];
  repeated string impersonation_chain = 3 [(pipeline_models.validation.is_parameterizable) = true];
}

message DataprocOnGceEngine {
  oneof config {
    DataprocExistingClusterConfiguration existing_cluster = 1;
    DataprocEphemeralConfiguration ephemeral_cluster = 2;
  }
}

message DataprocExistingClusterConfiguration {
  string cluster_name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  string location = 2 [(pipeline_models.validation.is_parameterizable) = true];
  string project_id = 3 [(pipeline_models.validation.is_parameterizable) = true];
  repeated string impersonation_chain = 4 [(pipeline_models.validation.is_parameterizable) = true];
  map<string, string> properties = 5 [(pipeline_models.validation.is_parameterizable) = true];
}

message DataprocEphemeralConfiguration {
  string cluster_name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  string location = 2 [(pipeline_models.validation.is_parameterizable) = true];
  string project_id = 3 [(pipeline_models.validation.is_parameterizable) = true];
  DataprocClusterResourceProfile resource_profile = 4 [(pipeline_models.validation.is_required) = true];
  map<string, string> properties = 5 [(pipeline_models.validation.is_parameterizable) = true];
  repeated string impersonation_chain = 6 [(pipeline_models.validation.is_parameterizable) = true];
}

message DataprocClusterResourceProfile {
  message InlineConfig {
    oneof config_alias {
      // A Dataproc cluster config.
      // See: https://docs.cloud.google.com/dataproc/docs/reference/rest/v1/ClusterConfig
      google.protobuf.Struct cluster_config = 1 [deprecated = true];

      // A Dataproc cluster config.
      // See: https://docs.cloud.google.com/dataproc/docs/reference/rest/v1/ClusterConfig
      google.protobuf.Struct config = 2 [(pipeline_models.validation.is_parameterizable) = true];
    }
  }
  oneof config {
    InlineConfig inline = 1;
    string path = 2 [(pipeline_models.validation.is_parameterizable) = true];
    string external_config_path = 3 [(pipeline_models.validation.is_parameterizable) = true];
  }
  // Overrides are applied with deep merge onto the provided config. Works with inline, path and external config path.
  InlineConfig overrides = 4;
}

message DataprocBatchResourceProfile {
  message InlineConfig {
    // A Dataproc runtime config for a batch job.
    // See: https://docs.cloud.google.com/dataproc-serverless/docs/reference/rest/v1/RuntimeConfig
    google.protobuf.Struct runtime_config = 1 [(pipeline_models.validation.is_parameterizable) = true];
    // A Dataproc environment config for a batch job.
    // See: https://docs.cloud.google.com/dataproc-serverless/docs/reference/rest/v1/EnvironmentConfig
    google.protobuf.Struct environment_config = 2 [(pipeline_models.validation.is_parameterizable) = true];
  }
  oneof config {
    InlineConfig inline = 1;
    string path = 2 [(pipeline_models.validation.is_parameterizable) = true];
    string external_config_path = 3 [(pipeline_models.validation.is_parameterizable) = true];
  }
  // Overrides are applied with deep merge onto the provided config. Works with inline, path and external config path.
  InlineConfig overrides = 4;
}

message DataprocServerlessBatchEngine {
  string location = 1 [(pipeline_models.validation.is_parameterizable) = true];
  DataprocBatchResourceProfile resource_profile = 2 [(pipeline_models.validation.is_required) = true];
  repeated string impersonation_chain = 3 [(pipeline_models.validation.is_parameterizable) = true];
}

/////////////////////////
// Actions
////////////////////////
message Action {
  oneof action {
    PythonAction python = 1;
    PysparkAction pyspark = 2;
    NotebookAction notebook = 3;
    SqlAction sql = 4;
    PipelineAction pipeline = 5;
    DataIngestionAction data_ingestion = 6;
    OrchestrationPipelineAction orchestration_pipeline = 7;
    AIAction ai = 8;
    AirflowTaskAction airflow_task = 9;
  }
}

/////////////////////////
// Python Action
////////////////////////
message PythonAction {
  string name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.regex) = "^[a-zA-Z0-9_.-]+$",
    (pipeline_models.validation.min_len) = 1,
    (pipeline_models.validation.max_len) = 64
  ];
  repeated string depends_on = 2;
  string execution_timeout = 3 [
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  string main_file_path = 4 [(pipeline_models.validation.is_required) = true];
  string python_callable = 5 [(pipeline_models.validation.is_required) = true];
  google.protobuf.Struct op_kwargs = 6 [(pipeline_models.validation.is_parameterizable) = true];
  PythonEnvironment environment = 7;
  PythonEngine engine = 8 [(pipeline_models.validation.is_required) = true];
  TriggerRule trigger_rule = 9; // Default: all_success.
  RetryPolicy retry_policy = 10;
  map<string, string> dynamic_bindings = 11;
  string run_if = 12 [(pipeline_models.validation.is_parameterizable) = true];
}

message PythonEnvironment {
  message InlineRequirements {
    repeated string list = 1;
  }
  message Requirements {
    oneof requirements {
      InlineRequirements inline = 1;
      string path = 2;
    }
  }

  Requirements requirements = 1;
  bool system_site_packages = 2; // Default: false.
}

message PythonEngine {
  oneof engine {
    LocalEngine local = 1;
  }
}

/////////////////////////
// PySpark Action
////////////////////////
message PysparkAction {
  string name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.regex) = "^[a-zA-Z0-9_.-]+$",
    (pipeline_models.validation.min_len) = 1,
    (pipeline_models.validation.max_len) = 64
  ];
  repeated string depends_on = 2;
  string execution_timeout = 3 [
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  PysparkEngine engine = 4 [(pipeline_models.validation.is_required) = true];
  string main_file_path = 5 [(pipeline_models.validation.is_required) = true];
  repeated string archive_uris = 6;
  string staging_bucket = 7 [(pipeline_models.validation.is_parameterizable) = true];
  repeated string py_files = 8;
  PysparkEnvironment environment = 9;
  TriggerRule trigger_rule = 10; // Default: all_success.
  map<string, string> params = 11 [
    (pipeline_models.validation.map_key_regex) = "^[a-zA-Z0-9_-]+$",
    (pipeline_models.validation.map_value_regex) = "^[^';|`&]+$",
    (pipeline_models.validation.is_parameterizable) = true
  ];
  map<string, string> labels = 12 [(pipeline_models.validation.is_parameterizable) = true];
  RetryPolicy retry_policy = 13;
  map<string, string> dynamic_bindings = 14;
  string run_if = 15 [(pipeline_models.validation.is_parameterizable) = true];
}

message PysparkEngine {
  oneof engine {
    DataprocOnGceEngine dataproc_on_gce = 1;
    DataprocServerlessBatchEngine dataproc_serverless = 2;
  }
}

message PysparkEnvironment {
  message InlineRequirements {
    repeated string list = 1;
  }
  message Requirements {
    oneof requirements {
      string path = 1;
      InlineRequirements inline = 2;
    }
  }
  Requirements requirements = 1;
}

/////////////////////////
// Notebook Action
////////////////////////
message NotebookAction {
  string name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.regex) = "^[a-zA-Z0-9_.-]+$",
    (pipeline_models.validation.min_len) = 1,
    (pipeline_models.validation.max_len) = 64
  ];
  repeated string depends_on = 2;
  string execution_timeout = 3 [
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  NotebookEngine engine = 4 [(pipeline_models.validation.is_required) = true];

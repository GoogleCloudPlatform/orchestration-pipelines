  }
  message Requirements {
    oneof requirements {
      string path = 1;
      InlineRequirements inline = 2;
    }
  }
  Requirements requirements = 1;
}

/////////////////////////
// SQL Action
////////////////////////
message SqlAction {
  string name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.regex) = "^[a-zA-Z0-9_.-]+$",
    (pipeline_models.validation.min_len) = 1,
    (pipeline_models.validation.max_len) = 64
  ];
  repeated string depends_on = 2;
  string execution_timeout = 3 [
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  SqlEngine engine = 4 [(pipeline_models.validation.is_required) = true];
  Query query = 5 [(pipeline_models.validation.is_required) = true];
  TriggerRule trigger_rule = 6; // Default: all_success.
  map<string, string> params = 7 [
    (pipeline_models.validation.map_key_regex) = "^[a-zA-Z0-9_-]+$",
    (pipeline_models.validation.map_value_regex) = "^[^';|`&]+$",
    (pipeline_models.validation.is_parameterizable) = true
  ];
  map<string, string> labels = 8 [(pipeline_models.validation.is_parameterizable) = true];
  RetryPolicy retry_policy = 9;
  map<string, string> dynamic_bindings = 10;
  string run_if = 11 [(pipeline_models.validation.is_parameterizable) = true];
}

message Query {
  oneof query {
    string inline = 1;
    string path = 2;
  }
}

message SqlEngine {
  oneof engine {
    BigQueryEngine bigquery = 1;
    DataprocServerlessBatchEngine dataproc_serverless = 2;
    DataprocOnGceEngine dataproc_on_gce = 3;
  }
}

/////////////////////////
// Pipeline
////////////////////////
message PipelineAction {
  string name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.regex) = "^[a-zA-Z0-9_.-]+$",
    (pipeline_models.validation.min_len) = 1,
    (pipeline_models.validation.max_len) = 64
  ];
  repeated string depends_on = 2;
  string execution_timeout = 3 [
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  PipelineFramework framework = 4 [(pipeline_models.validation.is_required) = true];
  TriggerRule trigger_rule = 5; // Default: all_success.

  // Note: 'params' is currently not supported when executing Dataform using Dataform Service.
  map<string, string> params = 6 [
    (pipeline_models.validation.map_key_regex) = "^[a-zA-Z0-9_-]+$",
    (pipeline_models.validation.map_value_regex) = "^[^';|`&]+$",
    (pipeline_models.validation.is_parameterizable) = true
  ];
  // Note: 'labels' is currently not supported when executing DBT or Dataform using Dataform Service.
  map<string, string> labels = 7 [(pipeline_models.validation.is_parameterizable) = true];
  RetryPolicy retry_policy = 8;
  map<string, string> dynamic_bindings = 9;
  string run_if = 10 [(pipeline_models.validation.is_parameterizable) = true];
}

message PipelineFramework {
  oneof framework {
    DbtFrameworkSpec dbt = 1;
    DataformFrameworkSpec dataform = 2;
  }
}

message DbtFrameworkSpec {
  oneof execution {
    // Execute DBT using Airflow Worker (local execution).
    DbtAirflowExecution airflow_worker = 1;
  }
}

message DataformFrameworkSpec {
  oneof execution {
    // Execute Dataform using Dataform Service.
    DataformServiceExecution dataform_service = 1;
    // Execute Dataform using Airflow Worker (local execution).
    DataformAirflowExecution airflow_worker = 2;
  }
}

// Configuration for executing on Dataform Service.
message DataformServiceExecution {
  string location = 1 [(pipeline_models.validation.is_parameterizable) = true];
  string project_id = 2 [(pipeline_models.validation.is_parameterizable) = true];
  string repository_id = 3 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  // Configuration for the workflow invocation, which specifies which actions to run.
  // See: https://docs.cloud.google.com/php/docs/reference/cloud-dataform/latest/V1beta1.WorkflowInvocation
  google.protobuf.Struct workflow_invocation = 4 [(pipeline_models.validation.is_parameterizable) = true];
}

// Configuration for executing DBT on Airflow Worker.
message DbtAirflowExecution {
  // Relative path to folder containing DBT project.
  string project_directory_path = 1 [(pipeline_models.validation.is_required) = true];
  // List of models to include in the run (equivalent to dbt --select).
  repeated string select_models = 2 [(pipeline_models.validation.is_parameterizable) = true];
  repeated string tags = 3 [(pipeline_models.validation.is_parameterizable) = true];
}

// Configuration for executing Dataform on Airflow Worker.
message DataformAirflowExecution {
  string project_directory_path = 1 [(pipeline_models.validation.is_required) = true];
}

/////////////////////////
// Data Ingestion Action
////////////////////////
message DataIngestionAction {
  string name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.regex) = "^[a-zA-Z0-9_.-]+$",
    (pipeline_models.validation.min_len) = 1,
    (pipeline_models.validation.max_len) = 64
  ];
  repeated string depends_on = 2;
  string execution_timeout = 3 [
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];

  oneof config {
    BigQueryDtsSpec bigquery_dts = 4;
  }
  TriggerRule trigger_rule = 5; // Default: all_success.
  RetryPolicy retry_policy = 6;
  map<string, string> dynamic_bindings = 7;
  string run_if = 8 [(pipeline_models.validation.is_parameterizable) = true];
}

message BigQueryDtsSpec {
  oneof transfer_config {
    string transfer_config_id = 1 [
      (pipeline_models.validation.is_required) = true,
      (pipeline_models.validation.is_parameterizable) = true
    ];
  }
  google.protobuf.Struct runtime_params = 2 [deprecated = true];

  message TimeRange {
    string start_time = 1 [
      (pipeline_models.validation.is_iso8601_timestamp) = true,
      (pipeline_models.validation.is_parameterizable) = true
    ];
    string end_time = 2 [
      (pipeline_models.validation.is_iso8601_timestamp) = true,
      (pipeline_models.validation.is_parameterizable) = true
    ];
  }
  oneof time {
    // See: https://docs.cloud.google.com/bigquery/docs/reference/datatransfer/rpc/google.cloud.bigquery.datatransfer.v1#timerange
    TimeRange requested_time_range = 6;
    string requested_run_time = 7 [
      (pipeline_models.validation.is_iso8601_timestamp) = true,
      (pipeline_models.validation.is_parameterizable) = true
    ];
  }

  repeated string impersonation_chain = 3 [(pipeline_models.validation.is_parameterizable) = true];
  string project_id = 4 [(pipeline_models.validation.is_parameterizable) = true];
  string location = 5 [(pipeline_models.validation.is_parameterizable) = true];
}

/////////////////////////////////////
// Orchestration Pipeline Action
////////////////////////////////////
message OrchestrationPipelineAction {
  string name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.regex) = "^[a-zA-Z0-9_.-]+$",
    (pipeline_models.validation.min_len) = 1,
    (pipeline_models.validation.max_len) = 64
  ];
  repeated string depends_on = 2;
  string execution_timeout = 3 [
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];

  string pipeline_id = 4 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.regex) = "^[a-zA-Z0-9_-]+$",
    (pipeline_models.validation.min_len) = 1,
    (pipeline_models.validation.max_len) = 64
  ];
  string bundle_id = 5;
  bool wait_for_completion = 6 [(pipeline_models.validation.is_parameterizable) = true]; // Default: false.
  TriggerRule trigger_rule = 7; // Default: all_success.
  RetryPolicy retry_policy = 8;
  google.protobuf.Struct params = 9 [(pipeline_models.validation.is_parameterizable) = true];
  map<string, string> dynamic_bindings = 10;
  string run_if = 11 [(pipeline_models.validation.is_parameterizable) = true];
}

/////////////////////////
// AI Action
////////////////////////
message AIAction {
  string name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.regex) = "^[a-zA-Z0-9_.-]+$",
    (pipeline_models.validation.min_len) = 1,
    (pipeline_models.validation.max_len) = 64
  ];
  repeated string depends_on = 2;
  string execution_timeout = 3 [
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  TriggerRule trigger_rule = 4; // Default: all_success.

  oneof provider {
    AgentPlatform agent_platform = 5;
  }

  map<string, string> labels = 6 [(pipeline_models.validation.is_parameterizable) = true];
  RetryPolicy retry_policy = 7;
  map<string, string> dynamic_bindings = 8;
  string run_if = 9 [(pipeline_models.validation.is_parameterizable) = true];
}

message AgentPlatform {
  string project_id = 1 [(pipeline_models.validation.is_parameterizable) = true];
  string location = 2 [(pipeline_models.validation.is_parameterizable) = true];

  oneof type {
    AgentPlatformModelUpload model_upload = 3;
    AgentPlatformBatchInference batch_inference = 4;
    AgentPlatformCreateAndRunCustomJob create_and_run_custom_job = 5;
  }
}

message AgentPlatformModelUpload {
  string model_name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  string description = 2 [(pipeline_models.validation.is_parameterizable) = true];
  string model_artifact_uri = 3 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  string serving_container_image_uri = 4 [(pipeline_models.validation.is_required) = true];
}

message AgentPlatformBatchInference {
  string job_display_name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  string model_name = 2 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  string instances_format = 3 [(pipeline_models.validation.is_parameterizable) = true];
  string predictions_format = 4 [(pipeline_models.validation.is_parameterizable) = true];
  string bigquery_source = 5 [(pipeline_models.validation.is_parameterizable) = true];
  repeated string gcs_source = 6 [(pipeline_models.validation.is_parameterizable) = true];
  string bigquery_destination_prefix = 7 [(pipeline_models.validation.is_parameterizable) = true];
  string gcs_destination_prefix = 8 [(pipeline_models.validation.is_parameterizable) = true];
  repeated string impersonation_chain = 12 [(pipeline_models.validation.is_parameterizable) = true];
}

message AgentPlatformCreateAndRunCustomJob {
  google.protobuf.Struct custom_job = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  string execution_timeout = 2 [
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  repeated string impersonation_chain = 3 [(pipeline_models.validation.is_parameterizable) = true];
}

message AirflowTaskAction {
  string name = 1 [
    (pipeline_models.validation.is_required) = true,
    (pipeline_models.validation.regex) = "^[a-zA-Z0-9_.-]+$",
    (pipeline_models.validation.min_len) = 1,
    (pipeline_models.validation.max_len) = 64
  ];
  repeated string depends_on = 2;
  string execution_timeout = 3 [
    (pipeline_models.validation.is_iso8601_duration) = true,
    (pipeline_models.validation.is_parameterizable) = true
  ];
  TriggerRule trigger_rule = 4;
  string operator_class = 5 [(pipeline_models.validation.is_required) = true];
  google.protobuf.Struct params = 6 [
    (pipeline_models.validation.map_key_regex) = "^[a-zA-Z0-9_-]+$",
    (pipeline_models.validation.is_parameterizable) = true
  ];
  RetryPolicy retry_policy = 7;
  map<string, string> dynamic_bindings = 8;
  string run_if = 9 [(pipeline_models.validation.is_parameterizable) = true];
}

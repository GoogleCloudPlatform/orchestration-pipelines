modelVersion: "1.0"
pipelineId: "pipeline-vertex-ai-custom-job"
description: "Example pipeline creating and running a custom job on Vertex AI."
runner: "airflow"
owner: "ml_eng"
tags: ["ai", "vertex", "custom-job"]

defaults:
  projectId: "your-gcp-project-id"
  location: "us-central1"
  executionConfig:
    retries: 1

triggers:
  - schedule:
      interval: "0 0 * * *"
      startTime: "2026-01-01T00:00:00"
      catchup: false
      timezone: "UTC"

actions:
  - ai:
      name: "run_vertex_custom_job"
      agentPlatform:
        createAndRunCustomJob:
          executionTimeout: "2h"
          customJob:
            displayName: "my_custom_training_job"
            jobSpec:
              workerPoolSpecs:
                - machineSpec:
                    machineType: "n1-standard-4"
                  replicaCount: 1
                  containerSpec:
                    imageUri: "us-docker.pkg.dev/vertex-ai/training/tf-cpu.2-12.py310:latest"
                    command: ["python", "train.py"]

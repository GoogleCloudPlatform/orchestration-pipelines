modelVersion: "1.0"
pipelineId: "pipeline-vertex-ai-batch-inference"
description: "Example pipeline running batch prediction on Vertex AI."
runner: "airflow"
owner: "ml_eng"
tags: ["ai", "vertex", "batch-inference"]

defaults:
  projectId: "your-gcp-project-id"
  location: "us-central1"
  executionConfig:
    retries: 1

triggers:
  - schedule:
      interval: "0 0 * * *"
      startTime: "2026-01-01T00:00:00"
      catchup: false
      timezone: "UTC"

actions:
  - ai:
      name: "run_vertex_batch_prediction"
      agentPlatform:
        batchInference:
          jobDisplayName: "days_batch_prediction"
          modelName: "projects/your-gcp-project-id/locations/us-central1/models/123456789"
          instancesFormat: "bigquery"
          predictionsFormat: "bigquery"
          bigquerySource: "bq://your-gcp-project-id.mlops.inference_dataset"
          bigqueryDestinationPrefix: "bq://your-gcp-project-id.mlops"

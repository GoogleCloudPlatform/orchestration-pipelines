modelVersion: "1.0"
pipelineId: "pipeline-dataset-producer"
description: "Example upstream producer pipeline declaring BigQuery and Cloud Storage dataset outlets."
runner: "airflow"
owner: "data-eng-team"
tags: ["dataset-aware", "producer", "example"]

defaults:
  projectId: "your-gcp-project-id"
  location: "us-central1"
  executionConfig:
    retries: 0

triggers:
  - schedule:
      interval: "0 2 * * *"
      startTime: "2026-01-01T00:00:00"
      catchup: false
      timezone: "UTC"

actions:
  - sql:
      name: "transform_daily_sales"
      query:
        inline: "CREATE OR REPLACE TABLE `your-gcp-project-id.my_dataset.daily_sales` AS SELECT customer_id, SUM(amount) AS total_amount, CURRENT_TIMESTAMP() AS processed_at FROM `your-gcp-project-id.my_dataset.raw_orders` WHERE DATE(order_timestamp) = CURRENT_DATE() GROUP BY customer_id;"
      engine:
        bigquery:
          location: "US"
      outlets:
        - "bq://my-project.my_dataset.daily_sales"

  - python:
      name: "export_sales_to_gcs"
      mainFilePath: "./scripts/export_sales.py"
      pythonCallable: "export_daily_sales"
      opKwargs:
        target_gcs_uri: "gs://my-bucket/sales/daily.csv"
      engine:
        local: {}
      dependsOn:
        - "transform_daily_sales"
      outlets:
        - "gs://my-bucket/sales/daily.csv"

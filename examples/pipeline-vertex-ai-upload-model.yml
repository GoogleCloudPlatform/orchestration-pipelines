modelVersion: "1.0"
pipelineId: "pipeline-vertex-ai-upload-model"
description: "Example pipeline uploading a machine learning model to Vertex AI."
runner: "airflow"
owner: "ml_eng"
tags: ["ai", "vertex", "model-upload"]

defaults:
  projectId: "your-gcp-project-id"
  location: "us-central1"
  executionConfig:
    retries: 1

triggers:
  - schedule:
      interval: "0 0 * * *"
      startTime: "2026-01-01T00:00:00"
      catchup: false
      timezone: "UTC"

actions:
  - ai:
      name: "upload_model_vertex"
      agentPlatform:
        modelUpload:
          modelName: "Predictor"
          description: "Prediction model"
          modelArtifactUri: "gs://your-bucket-name/models/spark_rf_model"
          servingContainerImageUri: "us-docker.pkg.dev/vertex-ai/prediction/sklearn-cpu.1-4:latest"
